name: Keep Supabase awake

# Supabase pauses a free project after about a week with no API activity. This
# touches the database every second day so the clock never runs out, and writes
# a timestamp back to the repo so GitHub does not disable the schedule itself
# after 60 days of no commits.
#
# No secrets are needed: the URL and the publishable key below are the same two
# values already sitting in index.html. The expected answer is HTTP 401
# "permission denied for table questions" - that error comes from Postgres
# itself, which proves the request went API gateway -> PostgREST -> database
# and back. An anonymous caller being refused by RLS design still counts as
# real database activity.

on:
  schedule:
    - cron: '17 6 */2 * *'      # 06:17 UTC, every second day
  workflow_dispatch:             # and a "Run workflow" button, any time

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch the database
        run: |
          CODE=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            -H 'apikey: sb_publishable_9k0N91WSBVmliPE6hYER2w_3kQz4VHY' \
            -H 'Accept: application/json' \
            'https://jnwbcfwtlnrupkthbluh.supabase.co/rest/v1/questions?select=uid&limit=1')
          echo "HTTP $CODE"
          head -c 300 /tmp/out.txt; echo
          # The healthy answer is 401 with a Postgres "permission denied"
          # body (the database spoke). "Unregistered API key" means the key
          # was rotated and this file needs the new one - fail loudly so the
          # run goes red instead of pinging nothing for months.
          if [ "$CODE" = "000" ]; then echo "No response - project may be paused"; exit 1; fi
          if grep -q 'Unregistered API key' /tmp/out.txt; then
            echo "Publishable key is stale - update keepalive.yml with the key from index.html"
            exit 1
          fi

      - name: Record the ping
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name  'keepalive'
          git config user.email 'keepalive@users.noreply.github.com'
          git add .keepalive
          git commit -m 'keepalive' || exit 0
          git push
