document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x;font-weight:600;cursor:pointer;text-decoration:none\" style-hover=\"background:#5068F0\">Choose 1 year<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:18px 0 0;font-size:12.5px;color:#728195\">Prices in Saudi riyals. Paid through Tap — Visa, Mastercard, mada and Apple Pay. Choosing a plan opens the Create account tab above.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"directors\" style=\"position:relative;z-index:1;padding:clamp(56px,8vw,96px) clamp(16px,4vw,56px);max-width:1440px;margin:0 auto;box-sizing:border-box\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:clamp(32px,5vw,72px);padding:clamp(24px,4vw,56px);border:1px solid #1B2335;border-radius:4px;background:linear-gradient(135deg,rgba(64,89,232,.14),rgba(10,13,21,0) 55%),#0A0D15\">\n<div>\n<div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8098FF\">03 — Programme directors<\u002Fdiv>\n<h2 style=\"margin:14px 0 18px;font-size:clamp(30px,3vw,40px);letter-spacing:-.03em;font-weight:600;line-height:1.05;text-wrap:pretty\">Run your whole programme on one bank.<\u002Fh2>\n<p style=\"margin:0 0 32px;font-size:15px;line-height:1.6;color:#98A3B8;max-width:44ch;text-wrap:pretty\">Buy seats for your residents as one group, billed yearly. You get a mock bank they have never seen, a weekly report on each of them, and a consultant of your choice to keep watch.<\u002Fp>\n<a href=\"#top\" sc-camel-on-click=\"{{ aGoDirector }}\" style=\"display:inline-grid;place-items:center;height:46px;padding:0 22px;border-radius:4px;background:#4059E8;color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none\" style-hover=\"background:#5068F0\">Request a quote<\u002Fa>\n<div style=\"margin-top:12px;font-size:12.5px;color:#728195\">Opens the Directors tab in the window above. We usually reply within a day.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;gap:1px;background:#1B2335;border:1px solid #1B2335;border-radius:4px;overflow:hidden;align-self:start\">\n<div style=\"background:#0A0D15;padding:18px 20px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start\"><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:15px;color:#8098FF;padding-top:2px\">1,000+<\u002Fdiv><div><b style=\"display:block;font-weight:600;font-size:15px;margin-bottom:3px\">Director-only mock bank<\u002Fb><span style=\"font-size:13.5px;color:#98A3B8;line-height:1.55\">MCQs that are not in the residents' bank, for internal mock exams they cannot have seen.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#0A0D15;padding:18px 20px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start\"><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:15px;color:#8098FF;padding-top:2px\">Weekly<\u002Fdiv><div><b style=\"display:block;font-weight:600;font-size:15px;margin-bottom:3px\">A report on every resident<\u002Fb><span style=\"font-size:13.5px;color:#98A3B8;line-height:1.55\">Progress by topic and track, each week, for each individual.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#0A0D15;padding:18px 20px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start\"><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:15px;color:#8098FF;padding-top:2px\">1<\u002Fdiv><div><b style=\"display:block;font-weight:600;font-size:15px;margin-bottom:3px\">A consultant of your choice<\u002Fb><span style=\"font-size:13.5px;color:#98A3B8;line-height:1.55\">Assign someone to monitor the cohort alongside you.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#0A0D15;padding:18px 20px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start\"><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:15px;color:#8098FF;padding-top:2px\">Yearly<\u002Fdiv><div><b style=\"display:block;font-weight:600;font-size:15px;margin-bottom:3px\">Group seats, one invoice<\u002Fb><span style=\"font-size:13.5px;color:#98A3B8;line-height:1.55\">Tell us how many residents. We send the quote.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer id=\"legal\" style=\"position:relative;z-index:1;border-top:1px solid #1B2335\">\n<div style=\"padding:clamp(40px,5vw,56px) clamp(16px,4vw,56px) 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:40px;font-size:13px;line-height:1.65;color:#728195;max-width:1440px;margin:0 auto;box-sizing:border-box\">\n<div><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#98A3B8;margin-bottom:12px\">Support<\u002Fdiv><p style=\"margin:0\">A wrong question, a failed payment, or you cannot get in: write to <a href=\"mailto:support@cerebrobanq.com\" style=\"color:#8098FF;text-decoration:none\">support@cerebrobanq.com<\u002Fa>. For a faulty question, the Report a problem button under it is faster.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#98A3B8;margin-bottom:12px\">About the questions<\u002Fdiv><p style=\"margin:0\">Part 1, Part 2 and Promotion papers are written to resemble the real examinations in style, level and blueprint. They are not the SCFHS bank and nothing is copied from it. Compiled from multiple neurology references and cross-checked against standard textbooks and current guidelines, each explanation citing its source. Where sources disagree, a question is marked <b style=\"color:#98A3B8;font-weight:500\">check this one<\u002Fb>.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#98A3B8;margin-bottom:12px\">Disclaimer<\u002Fdiv><p style=\"margin:0\">Exam revision only. Not clinical guidance, not a substitute for reading, and no guarantee of exam success. Independent: not affiliated with, endorsed by or produced by the Saudi Commission for Health Specialties or any programme or hospital.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#98A3B8;margin-bottom:12px\">Legal and registration<\u002Fdiv>\n<p style=\"margin:0 0 14px\"><a href=\"https://cerebrobanq.com\" style=\"color:#8098FF;text-decoration:none\">Refund and Cancellation Policy<\u002Fa><br><a href=\"https://cerebrobanq.com\" style=\"color:#8098FF;text-decoration:none\">Terms and Conditions<\u002Fa><br><span style=\"font-size:12px\">Both published in Arabic and English.<\u002Fspan><\u002Fp>\n<div style=\"padding:12px 14px;border:1px solid #1B2335;border-radius:4px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#0A0D15\">\n<img src=\"295fcbe2-d0af-4fef-8d93-f3bbe80157ec\" alt=\"Ministry of Commerce, Kingdom of Saudi Arabia\" style=\"width:42px;height:42px;border-radius:4px;background:#fff;flex:none;object-fit:contain\">\n<div style=\"font-size:12px;line-height:1.5;color:#98A3B8;flex:1;min-width:160px\">Registered establishment, Ministry of Commerce, KSA<br><span style=\"font-family:'Azeret Mono',ui-monospace,monospace;font-size:10.5px;color:#728195\">CerebroPilot Establishment · CR 7054697367 · Riyadh · Active<\u002Fspan><\u002Fdiv>\n<a href=\"https://qr.saudibusiness.gov.sa/viewcr?nCrNumber=bzEmMw4rHKNZm7ykjU7LsA==\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"margin-left:auto;font-weight:600;font-size:12px;color:#8098FF;text-decoration:none;white-space:nowrap\">Verify →<\u002Fa>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;padding-top:20px;border-top:1px solid #1B2335;font-size:12px\">\n<span>© 2026 CerebroPilot Establishment, Riyadh, Saudi Arabia · <a href=\"https://cerebropilot.com\" style=\"color:#8098FF;text-decoration:none\">cerebropilot.com<\u002Fa><\u002Fspan>\n<span>Payments processed by Tap Payments. Card details are never entered on or stored by this site.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;expressive&quot;,&quot;options&quot;:[&quot;expressive&quot;,&quot;subtle&quot;,&quot;still&quot;],&quot;tsType&quot;:&quot;'expressive' | 'subtle' | 'still'&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  state = { a: { tab: 'signin', step: 'email', email: '', plan: 'y' }, resid: 12 };\n  PLANS = { m: 100, q: 270, y: 900 };\n\n  upd(k, patch) { this.setState(s => ({ [k]: Object.assign({}, s[k], patch) })); }\n  stop(e) { if (e && e.preventDefault) e.preventDefault(); }\n\n  codeInput = e => {\n    const el = e.target;\n    el.value = el.value.replace(/\\D/g, '').slice(-1);\n    if (el.value && el.nextElementSibling) el.nextElementSibling.focus();\n  };\n  codeKey = e => {\n    if (e.key === 'Backspace' && !e.target.value && e.target.previousElementSibling) e.target.previousElementSibling.focus();\n  };\n\n  rng(seed) { let s = seed; return () => (s = (s * 48271) % 2147483647) / 2147483647; }\n\n  // logo: the bundler hands us a blob URL through window.__resources; unbundled we read the file\n  logoUrl() { return (window.__resources && window.__resources.logo) || './logo.svg'; }\n\n  synapse(anim) {\n    const h = React.createElement, rnd = this.rng(20260904), W = 1440, H = 860, N = [];\n    for (let i = 0; i < 56; i++) N.push({ x: Math.round(rnd() * W), y: Math.round(rnd() * H), r: +(1 + rnd() * 2).toFixed(1), d: +(rnd() * 5).toFixed(2) });\n    const L = [];\n    N.forEach((n, i) => N.map((m, j) => ({ j, d: Math.hypot(m.x - n.x, m.y - n.y) })).filter(o => o.j > i).sort((p, q) => p.d - q.d).slice(0, 2).forEach(o => L.push([n, N[o.j]])));\n    const kids = [];\n    L.forEach((l, i) => kids.push(h('line', { key: 'l' + i, x1: l[0].x, y1: l[0].y, x2: l[1].x, y2: l[1].y, stroke: '#8098FF', strokeOpacity: .16 })));\n    if (anim) L.forEach((l, i) => { if (i % 3 === 0) kids.push(h('line', { key: 'p' + i, x1: l[0].x, y1: l[0].y, x2: l[1].x, y2: l[1].y, stroke: '#C2CCFF', strokeWidth: 1.6, strokeLinecap: 'round', strokeDasharray: '12 1188', style: { animation: 'cbq-dash ' + (6 + i % 7) + 's linear infinite', animationDelay: -(i * 1.1) + 's' } })); });\n    N.forEach((n, i) => kids.push(h('circle', { key: 'n' + i, cx: n.x, cy: n.y, r: n.r, fill: '#8098FF', style: anim ? { animation: 'cbq-pulse ' + (3 + i % 4) + 's ease-in-out infinite', animationDelay: -n.d + 's' } : { opacity: .5 } })));\n    return h('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'xMidYMid slice', 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, width: '100%', height: '100%' } }, kids);\n  }\n\n  marks(anim) {\n    const h = React.createElement, mask = 'url(' + this.logoUrl() + ') center/contain no-repeat';\n    const sweep = h('div', { style: { position: 'absolute', inset: '-40%', background: 'conic-gradient(from 0deg, rgba(128,152,255,.42) 0deg, #8098FF 50deg, #FFFFFF 66deg, rgba(128,152,255,.42) 118deg, rgba(128,152,255,.42) 360deg)', animation: anim ? 'cbq-spin 7s linear infinite' : 'none' } });\n    return {\n      markNav: h('span', { role: 'img', 'aria-label': 'CerebrobanQ', style: { display: 'block', width: 34, height: 34, background: '#8098FF', mask, WebkitMask: mask } }),\n      markHero: h('div', { 'aria-hidden': 'true', style: { position: 'relative', width: 118, height: 120, marginBottom: 34 } },\n        h('div', { style: { position: 'absolute', inset: -34, borderRadius: '50%', background: 'radial-gradient(circle,rgba(128,152,255,.30),transparent 70%)' } }),\n        h('div', { style: { position: 'absolute', inset: 0, mask, WebkitMask: mask, background: '#8098FF', overflow: 'hidden' } }, sweep))\n    };\n  }\n\n  fields() {\n    const motion = this.props.motion ?? 'expressive';\n    if (this._fm !== motion) {\n      this._fm = motion;\n      const on = motion !== 'still', anim = motion === 'expressive';\n      this._f = Object.assign({ fieldA: on ? this.synapse(anim) : null }, this.marks(anim));\n    }\n    return this._f;\n  }\n\n  renderVals() {\n    const { a, resid } = this.state;\n    const ACC = '#8098FF', OFF = '#2A3550', SOFT = 'rgba(128,152,255,.10)';\n    const tab = on => ({ color: on ? '#E9EDF5' : '#728195', line: on ? ACC : 'transparent' });\n    const t1 = tab(a.tab === 'signin'), t2 = tab(a.tab === 'signup'), t3 = tab(a.tab === 'director');\n    const v = {\n      resid,\n      residDec: () => this.setState(s => ({ resid: Math.max(1, s.resid - 1) })),\n      residInc: () => this.setState(s => ({ resid: Math.min(500, s.resid + 1) })),\n      codeInput: this.codeInput, codeKey: this.codeKey,\n      aTabSignin: a.tab === 'signin', aTabSignup: a.tab === 'signup', aTabDirector: a.tab === 'director',\n      aTab1Color: t1.color, aTab1Line: t1.line, aTab2Color: t2.color, aTab2Line: t2.line, aTab3Color: t3.color, aTab3Line: t3.line,\n      aStepEmail: a.step === 'email', aStepCode: a.step === 'code',\n      aEmail: a.email || 'you@example.com',\n      aSetEmail: e => this.upd('a', { email: e.target.value }),\n      aSend: e => { this.stop(e); this.upd('a', { step: 'code' }); },\n      aBack: e => { this.stop(e); this.upd('a', { step: 'email' }); },\n      aGoSignin: () => this.upd('a', { tab: 'signin' }),\n      aGoSignup: () => this.upd('a', { tab: 'signup' }),\n      aGoDirector: () => this.upd('a', { tab: 'director' }),\n      aChoosePlan: e => this.upd('a', { plan: e.currentTarget.dataset.plan }),\n      aPickPlan: e => this.upd('a', { tab: 'signup', plan: e.currentTarget.dataset.plan }),\n      aTotal: 'Continue to payment \\u00b7 ' + this.PLANS[a.plan] + ' SAR'\n    };\n    ['m', 'q', 'y'].forEach(x => { const on = a.plan === x, X = x.toUpperCase(); v['aChip' + X + 'Line'] = on ? ACC : OFF; v['aChip' + X + 'Bg'] = on ? SOFT : 'transparent'; });\n    return Object.assign(v, this.fields());\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
